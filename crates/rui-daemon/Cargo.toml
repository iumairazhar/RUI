[package]
name = "rui-daemon"
version = "0.1.0"
edition = "2024"

[dependencies]
rui-core = { path = "../rui-core" }
anyhow = "1"
axum = "0.8"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
rmcp = { version = "3.10", features = ["server", "macros", "transport-streamable-http-server"] }
rusqlite_migration = "2.3.0"

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"

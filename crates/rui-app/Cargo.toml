[package]
name = "rui-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "rui-app"
path = "src/main.rs"

[dependencies]
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
rui-core = { path = "../rui-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", features = ["json"] }
anyhow = "1"
